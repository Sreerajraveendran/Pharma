[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# One event loop for the whole run: the database engine and the app are created once
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning:xhtml2pdf.*
    ignore::DeprecationWarning:reportlab.*
