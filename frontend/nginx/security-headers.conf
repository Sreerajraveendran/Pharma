# Included by every location that serves the frontend. nginx drops inherited add_header
# directives as soon as a location defines its own, so they live here instead.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Enable once the site is served over HTTPS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
