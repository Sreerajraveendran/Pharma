# API-only proxy for the EC2 instance; CloudFront sends /api/* here and serves everything else
# from S3. Rate limits and proxy settings mirror frontend/nginx/nginx.conf.

# Only CloudFront can reach this server (security group), and CloudFront appends the viewer's
# IP as the last X-Forwarded-For entry, so take that one as the client IP
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# Brute-force protection for the login endpoint, per client IP
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=register:10m rate=3r/m;

server {
    listen 80 default_server;

    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Viewers always use HTTPS (CloudFront redirects HTTP); CloudFront talks to us over HTTP
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
    }

    location = /api/auth/register {
        limit_req zone=register burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_pass http://api:8000;
    }

    location / {
        return 404;
    }
}
