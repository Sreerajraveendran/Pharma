# Production stack on the EC2 instance. The database is RDS (DATABASE_URL in .env) and the
# frontend is served from S3 through CloudFront, so only the API and its proxy run here.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    image: ${API_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    env_file: .env
    # Published on localhost only, for the deploy health check
    ports:
      - "127.0.0.1:8000:8000"
    logging: *logging

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # The security group only lets CloudFront reach this port
    ports:
      - "80:80"
    volumes:
      - ./nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    logging: *logging
