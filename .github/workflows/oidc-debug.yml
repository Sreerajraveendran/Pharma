name: OIDC debug (temporary)

# Prints what GitHub's OIDC token claims and checks the shape of the AWS_ROLE_ARN secret,
# to find why sts:AssumeRoleWithWebIdentity is refused. Delete this file once AWS login works.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show the token claims AWS will check
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          # The token itself is never printed, only its public claims
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="$PAYLOAD="; done
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, repository, ref, event_name, job_workflow_ref}'

      - name: Check the shape of the AWS_ROLE_ARN secret
        env:
          ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "length: ${#ARN}"
          [ -z "$ARN" ] && { echo "EMPTY: the secret is missing or saved under another name/tab"; exit 0; }
          case "$ARN" in *[[:space:]]*) echo "PROBLEM: contains a space or new line";; esac
          case "$ARN" in
            arn:aws:iam::[0-9]*:role/*) echo "format: OK (an IAM role ARN)";;
            *oidc-provider*)            echo "PROBLEM: this is the identity provider ARN, not the role ARN";;
            *)                          echo "PROBLEM: not an IAM role ARN";;
          esac
          echo "role name: ${ARN##*/}"
          ACCOUNT=$(echo "$ARN" | cut -d: -f5)
          echo "account id digits: ${#ACCOUNT} (must be 12)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}

      - name: Which role did GitHub get, and can it send the command?
        env:
          EC2_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # The role name is printed; the account ID is masked
          aws sts get-caller-identity --query Arn --output text | sed 's#.*assumed-role/#role: #; s#/.*##'
          echo "instance id in secret: length ${#EC2_ID}, starts with '${EC2_ID:0:2}'"
          aws ec2 describe-instances --instance-ids "$EC2_ID" \
            --query 'Reservations[0].Instances[0].[State.Name, Placement.AvailabilityZone]' --output text
          # A harmless command: if this works, SendCommand permissions are fine
          aws ssm send-command --instance-ids "$EC2_ID" --document-name AWS-RunShellScript \
            --parameters '{"commands":["echo permission-check-ok"]}' --query Command.Status --output text
